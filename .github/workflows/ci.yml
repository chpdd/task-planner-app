name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ============================================================
  # BACKEND JOBS
  # ============================================================

  backend-lint:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install ruff

      - name: Run ruff check
        run: ruff check services/

  backend-typecheck:
    name: Backend Type Check (Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install ruff mypy
          # Install service dependencies for type checking
          pip install -e services/planner[dev]
          pip install -e services/auth[dev]
          pip install -e services/admin[dev]

      - name: Run mypy
        run: |
          mypy services/planner/src --ignore-missing-imports || true
          mypy services/auth/src --ignore-missing-imports || true
          mypy services/admin/src --ignore-missing-imports || true

  backend-test:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.3
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test images
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml build planner auth admin

      - name: Run Planner Tests
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm \
            -e DATABASE_URL=postgresql+asyncpg://test:test@postgres:5432/test_db \
            -e REDIS_URL=redis://redis:6379 \
            planner uv run pytest -v

      - name: Run Auth Tests
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm \
            -e DATABASE_URL=postgresql+asyncpg://test:test@postgres:5432/test_db \
            auth uv run pytest -v

      - name: Run Admin Tests
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm \
            -e DATABASE_URL=postgresql+asyncpg://test:test@postgres:5432/test_db \
            admin uv run pytest -v

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

  # ============================================================
  # FRONTEND JOBS
  # ============================================================

  frontend-lint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  frontend-typecheck:
    name: Frontend Type Check (vue-tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run vue-tsc
        working-directory: frontend
        run: npm run type-check

  frontend-test:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest
        working-directory: frontend
        run: npm run test:run

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start backend services
        run: docker compose -f docker-compose.yml up -d

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/docs > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
          retention-days: 14

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml down

  # ============================================================
  # SUMMARY
  # ============================================================

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-typecheck, backend-test, frontend-lint, frontend-typecheck, frontend-test, frontend-build, frontend-e2e]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "All CI jobs completed"
          echo "Results:"
          echo "  - Backend Lint: ${{ needs.backend-lint.result }}"
          echo "  - Backend Type Check: ${{ needs.backend-typecheck.result }}"
          echo "  - Backend Tests: ${{ needs.backend-test.result }}"
          echo "  - Frontend Lint: ${{ needs.frontend-lint.result }}"
          echo "  - Frontend Type Check: ${{ needs.frontend-typecheck.result }}"
          echo "  - Frontend Unit Tests: ${{ needs.frontend-test.result }}"
          echo "  - Frontend Build: ${{ needs.frontend-build.result }}"
          echo "  - Frontend E2E: ${{ needs.frontend-e2e.result }}"

          # Fail if any job failed
          if [[ "${{ needs.backend-lint.result }}" != "success" ]] || \
             [[ "${{ needs.backend-typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.backend-test.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-lint.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-test.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-build.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-e2e.result }}" != "success" ]]; then
            echo "Some jobs failed!"
            exit 1
          fi
          echo "All jobs passed!"
